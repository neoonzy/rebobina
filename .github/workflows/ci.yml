name: Validação host

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mostrar versões
        run: |
          cc --version | head -n 1
          python3 --version
      - name: Compilar, executar testes e verificar manifestos
        run: |
          make demo
          make test
          make check-modules
          make audit-platform
          make plugin-demo
          make sim-ui
          make arm-objects

  undefined-behavior:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Executar testes host com UBSan (Linux)
        run: |
          make test CC=clang CFLAGS='-std=c11 -O1 -g -Wall -Wextra -Werror -pedantic -Iinclude -fsanitize=undefined -fno-sanitize-recover=all'

