name: REBOBINA 5DC 0.2.0 beta ARM build + tests
on:
  push:
    paths:
      - 'camera/5DC.111/beta-020/**'
      - '.github/workflows/5dc-beta-020.yml'
  pull_request:
    paths:
      - 'camera/5DC.111/beta-020/**'
      - '.github/workflows/5dc-beta-020.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cross compiler and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm binutils zip
      - name: Compile ARM + host tests
        run: make -C camera/5DC.111/beta-020 clean all test
      - name: Create downloadable beta package (not a camera installer)
        run: |
          cd camera/5DC.111/beta-020
          zip -q -r ../../../REBOBINA-5DC-0.2.0-beta.zip \
            README.md CHANGELOG.md LICENSE Makefile boot core include tools tests docs \
            FULL-UI/ML/RB8BETA.ON dist/SE.BIN dist/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: REBOBINA-5DC-0.2.0-beta-CANDIDATE-NOT-HARDWARE-VALIDATED
          path: REBOBINA-5DC-0.2.0-beta.zip
          if-no-files-found: error
