name: Relatar problema
description: Registre problemas reproduzíveis no Rebobina
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: context
    attributes:
      label: Ambiente
      options:
        - Host / Linux
        - Simulação de interface
        - Toolchain ARM (objetos apenas)
        - Canon EOS 5D Classic 1.1.1 (hardware de desenvolvimento)
        - Outro
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
      description: Não inclua dados privados nem arquivos Canon proprietários.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado e resultado observado
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Logs, revisão e testes relevantes
